name: dashly_for_seller
description: "Seller app for Dashly platform"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.4.0

  # UI & Animations
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # Push notifications (FCM)
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.1
  mobile_scanner: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
